name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - 'server.json'
      - 'server-remote.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" | tar xz mcp-publisher

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        shell: bash
        run: |
          set -o pipefail
          ./mcp-publisher publish 2>&1 | tee out1.log || grep -q "duplicate version" out1.log

      - name: Publish remote server listing
        shell: bash
        run: |
          set -o pipefail
          ./mcp-publisher publish server-remote.json 2>&1 | tee out2.log || grep -q "duplicate version" out2.log
