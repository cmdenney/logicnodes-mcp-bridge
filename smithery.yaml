name: logicnodes
displayName: "LogicNodes \xe2\x80\x94 Agent Infrastructure"
description: "Agent-to-agent payment, identity, and compliance infrastructure for autonomous AI on Base. 8 deterministic services: gas oracle, sig verify, peg monitor, escrow verifier, identity register, inference attestation, compliance sentry, hash-commitment compute attestation. All payable via x402 USDC."
version: "1.0.3"
author: "DENNEYTRADINGCO LLC"
homepage: "https://logicnodes.io"
license: MIT
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Your LogicNodes API key (get free at https://logicnodes.io/app)"
    required: []
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["index.js"],
      env: {
        LOGICNODES_API_KEY: config.apiKey || "free-trial"
      }
    })
tags:
  - blockchain
  - base
  - usdc
  - agent
  - identity
  - compliance
  - zk
  - defi
